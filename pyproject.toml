[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tshark-mcp"
version = "2.0.0"
description = "MCP server wrapping Wireshark's tshark for AI-assisted pcap analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "niusulong" }]
dependencies = [
    "mcp>=1.20",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[project.scripts]
tshark-mcp = "tshark_mcp:run"

[tool.hatch.build.targets.wheel]
packages = ["src/tshark_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests needing real tshark + pcap files",
    "slow: long-running tests on big pcapng",
]
